<mat-card-content>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit(registerForm)">
        <p>
            <mat-form-field>
                <input placeholder="Username" type="text" matInput formControlName="username" required>
            </mat-form-field>
        </p>

        <p>
            <mat-form-field>
                <input placeholder="Email" type="text" matInput formControlName="email" required>
            </mat-form-field>
        </p>

        <p>
            <mat-form-field>
                <input placeholder="Password" type="password" matInput formControlName="password" required>
            </mat-form-field>
        </p>

        <p>
            <mat-form-field>
                <input placeholder="Password Confirmation" type="password" matInput formControlName="passwordConfirm" required>
            </mat-form-field>
        </p>

        <p *ngIf="message!='Success'" class="error">
            {{ message }}
        </p>

        <div class="button">
            <button type="submit" mat-button>Register</button>
        </div>

    </form>
</mat-card-content>
