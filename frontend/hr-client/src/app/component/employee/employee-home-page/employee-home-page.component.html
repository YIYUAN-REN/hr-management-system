
<head>
    <link rel="stylesheet" href="//ajax.googleapis.com/ajax/libs/angular_material/0.10.0/angular-material.min.css">
  </head>
  
  <body>
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav #drawer class="sidenav" style="width:200px" fixedInViewport="true"
          [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
          [mode]="(isHandset$ | async) ? 'over' : 'side'"
          [opened]="!(isHandset$ | async)">
          <mat-card class="example-card">
  
              <img mat-card-image src="../../../assets/images/avatar-employee.png">
              <h4 style="color:#0693ba;">User Name : {{userName || "Danirl Huang"}}</h4>
              <h4 style="color:#0693ba;">Email : {{email || "daniel@beaconfire.com"}}</h4>
              <h4 style="color:#0693ba;">Role : Employee</h4> 
          </mat-card>
        <mat-nav-list>
          <a mat-list-item><div style="width: 100%; text-align: center;"></div></a>
          <a mat-list-item>
            <div style="width: 100%; text-align: center;">
              <div *ngIf = "currentPage!='Boarding'">
                <button mat-raised-button (click)="changeCurrentPage('Boarding')">On boarding</button>
              </div>
              <div *ngIf = "currentPage=='Boarding'">
                <button mat-raised-button color="accent" (click)="changeCurrentPage('Boarding')">On boarding</button>
              </div>
            </div>
          </a>
          <a mat-list-item>
            <div style="width: 100%; text-align: center;">
              <div *ngIf = "currentPage!='Personal Information'">
                <button mat-raised-button (click)="changeCurrentPage('Personal Information')">Personal Information</button>
              </div>
              <div *ngIf = "currentPage=='Personal Information'">
                <button mat-raised-button color="accent" (click)="changeCurrentPage('Personal Information')">Personal Information</button>
              </div>
            </div>
          </a>
          <a mat-list-item>
            <div style="width: 100%; text-align: center;">
              <div *ngIf = "currentPage!='Visa'">
                <button mat-raised-button (click)="changeCurrentPage('Visa')">Visa Status</button>
              </div>
              <div *ngIf = "currentPage=='Visa'">
                <button mat-raised-button color="accent" (click)="changeCurrentPage('Visa')">Visa Status</button>
              </div>
            </div>
          </a>
          <a mat-list-item>
            <div style="width: 100%; text-align: center;">
              <div *ngIf = "currentPage!='Housing'">
                <button mat-raised-button (click)="changeCurrentPage('Housing')">Housing</button>
              </div>
              <div *ngIf = "currentPage=='Housing'">
                <button mat-raised-button color="accent" (click)="changeCurrentPage('Housing')">Housing</button>
              </div>
            </div>
          </a>
          <a mat-list-item><div style="width: 100%; text-align: center;"></div></a>
          <a mat-list-item><div style="width: 100%; text-align: center;"></div></a>
  
        </mat-nav-list>
        <div><a><button mat-stroked-button color="primary" (click)="logOut()">Log Out</button></a></div>
  
      </mat-sidenav>
      <mat-sidenav-content>
        <mat-toolbar color="primary">
          <button
            type="button"
            aria-label="Toggle sidenav"
            mat-icon-button
            (click)="drawer.toggle()"
            *ngIf="isHandset$ | async">
            <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
          </button>
          <span style="text-align:center">Welcome to BeaconFire Solution !</span>
        </mat-toolbar>
        
        <div>
          <div *ngIf = "currentPage=='Personal Information'">
            <app-personal-info></app-personal-info>
          </div>
          <div *ngIf = "currentPage=='Visa'">
            <app-employee-visa-home></app-employee-visa-home>
          </div>
          <div *ngIf = "currentPage=='Boarding'">
            <app-employee-boarding-home></app-employee-boarding-home>
          </div>
          <div *ngIf = "currentPage=='Housing'">
            <app-employee-housing-home></app-employee-housing-home>
          </div>
        </div>
        
        
      </mat-sidenav-content>
    </mat-sidenav-container>
        <!-- Angular Material Dependencies -->
        <script src="//ajax.googleapis.com/ajax/libs/angularjs/1.3.15/angular.js"></script>
        <script src="//ajax.googleapis.com/ajax/libs/angularjs/1.3.15/angular-animate.js"></script>
        <script src="//ajax.googleapis.com/ajax/libs/angularjs/1.3.15/angular-aria.js"></script>
        <!-- Angular Material -->
        <script src="//ajax.googleapis.com/ajax/libs/angular_material/0.10.0/angular-material.min.js"></script>
  </body>
